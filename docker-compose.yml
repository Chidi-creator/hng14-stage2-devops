services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No ports: block — Redis is intentionally not reachable from the host
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  api:
    build:
      context: ./api
    restart: unless-stopped
    networks:
      - backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_NAME: "${QUEUE_NAME:-job}"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    networks:
      - backend
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_NAME: "${QUEUE_NAME:-job}"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    networks:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      API_URL: "${API_URL:-http://api:8000}"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  backend:
    driver: bridge
